<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>compute_PCT</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
  <div class="container py-4" style="max-width: 480px;">

    <h2>compute_PCT</h2>
    <p class="text-secondary">Grade</p>

    <div class="mb-3">
      <label class="form-label">Student name</label>
      <input id="name" class="form-control">
    </div>

    <div class="mb-3">
      <label class="form-label">Mark</label>
      <input id="mark" type="number" class="form-control">
    </div>

    <button id="btn" class="btn btn-primary">Compute PCT</button>

    <div id="out" class="alert alert-info mt-3 d-none"></div>

  </div>

  <script>

    document.getElementById("btn").onclick = function () {

      var name = document.getElementById("name").value;
      var mark = Number(document.getElementById("mark").value);

      var full = 100;
      var pct = (mark / full) * 100;

      var band;

      if (pct >= 90) band = "A";
      else if (pct >= 80) band = "B";
      else if (pct >= 70) band = "C";
      else if (pct >= 50) band = "D";
      else band = "Fail";

      var out = document.getElementById("out");

      out.classList.remove("d-none");

      out.innerText =
        `Student: ${name} | PCT: ${pct}% | Grade: ${band}`;
    };

  </script>
</body>
</html>
